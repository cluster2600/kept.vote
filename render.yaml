# Render Blueprint for the kept.vote FastAPI backend.
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: in the Render dashboard, New + → Blueprint → point at this repo.
# Render builds the image from the repo Dockerfile and runs the API as a web
# service. Set the secret env vars (DATABASE_URL, CORS_ORIGINS, and optionally
# ANTHROPIC_API_KEY) in the dashboard — they are declared with `sync: false`
# so Render prompts for them instead of reading values from this file.
services:
  - type: web
    name: kept-vote-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The app reads $PORT (set by Render) — see the Dockerfile CMD.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Neon (or any managed Postgres) connection string, e.g.
      #   postgresql://USER:PASSWORD@ep-xxx.region.aws.neon.tech/neondb?sslmode=require
      # The app strips sslmode/channel_binding and enables TLS via asyncpg.
      - key: DATABASE_URL
        sync: false
      # Comma-separated browser origins allowed to call the API. Set to the
      # deployed Vercel domain(s), e.g. https://kept-vote.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Optional — only needed for the live AI /api/verify endpoint. The seeded
      # site (curated verifications) works without it.
      - key: ANTHROPIC_API_KEY
        sync: false
